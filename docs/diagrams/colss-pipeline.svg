/><text x='536' y='72' font-weight='600' fill='#1c1c1c'>3 · Section details</text><text x='536' y='90' font-size='11.5' fill='#5e5e5e'>POST /Student/Courses/</text><text x='536' y='106' font-size='11.5' fill='#5e5e5e'>SectionDetails</text><text x='536' y='122' font-size='11.5' fill='#1c1c1c'>rooms, notes · optional</text></g><g><rect x='24' y='184' width='216' height='72' rx='8' fill='none' stroke='#a3a197' stroke-width='1.25'/><text x='40' y='208' font-weight='600' fill='#1c1c1c'>Normalize</text><text x='40' y='224' font-size='11.5' fill='#5e5e5e'>Course · Section · Meeting</text><text x='40' y='240' font-size='11.5' fill='#5e5e5e'>Instructor · Term</text></g><g><rect x='272' y='184' width='216' height='72' rx='8' fill='none' stroke='#a3a197' stroke-width='1.25'/><text x='288' y='208' font-weight='600' fill='#1c1c1c'>Store + cache</text><text x='288' y='224' font-size='11.5' fill='#5e5e5e'>courses · sections · meetings</text><text x='288' y='240' font-size='11.5' fill='#5e5e5e'>instructors · raw JSON</text></g><g><rect x='520' y='184' width='216' height='72' rx='8' fill='#2f6fd6' fill-opacity='0.12' stroke='#2f6fd6' stroke-width='2'/><text x='536' y='208' font-weight='600' fill='#1c1c1c'>Serves the app</text><text x='536' y='224' font-size='11.5' fill='#1c1c1c'>GET /courses · GET /sections</text><text x='536' y='240' font-size='11.5' fill='#1c1c1c'>clash = same day, overlapping</text></g></svg>
