<svg xmlns='http://www.w3.org/2000/svg' font-family='Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif' viewBox='0 0 760 360' role='img' aria-label='The front end calls eight endpoints; back end and data build them' font-size='13'><rect width='100%' height='100%' fill='#ffffff'/><defs><marker id='api-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#a3a197'/></marker></defs><text x='24' y='28' font-size='15' font-weight='600' fill='#1c1c1c'>The front end calls eight endpoints; back end and data build them</text><g font-size='11.5' font-weight='600'><text x='24' y='60' fill='#5e5e5e'>Front end builds</text><text x='248' y='60' fill='#5e5e5e'>Contract</text><text x='568' y='60' fill='#5e5e5e'>Built behind it</text></g><g fill='none' stroke='#a3a197' stroke-width='1.25'><path d='M200 134H248' marker-start='url(#api-arrow)' marker-end='url(#api-arrow)'/><path d='M200 274H248' marker-start='url(#api-arrow)' marker-end='url(#api-arrow)'/><path d='M568 134H520' marker-end='url(#api-arrow)'/><path d='M568 274H520' marker-end='url(#api-arrow)'/></g><g font-size='11.5'><text x='224' y='126' text-anchor='middle' fill='#5e5e5e'>on load</text><text x='224' y='266' text-anchor='middle' fill='#5e5e5e'>on edit</text><text x='544' y='126' text-anchor='middle' fill='#5e5e5e'>serves</text><text x='544' y='266' text-anchor='middle' fill='#5e5e5e'>runs</text></g><g><rect x='24' y='72' width='176' height='264' rx='8' fill='none' stroke='#a3a197' stroke-width='1.25'/><text x='112' y='96' text-anchor='middle' font-weight='600' fill='#1c1c1c'>Front end</text><text x='112' y='124' text-anchor='middle' fill='#1c1c1c'>Major picker</text><text x='112' y='146' text-anchor='middle' fill='#1c1c1c'>Profile editor</text><text x='112' y='168' text-anchor='middle' fill='#1c1c1c'>Prerequisite graph</text><text x='112' y='190' text-anchor='middle' fill='#1c1c1c'>Course details</text><text x='112' y='212' text-anchor='middle' fill='#1c1c1c'>Progress dashboard</text><text x='112' y='234' text-anchor='middle' fill='#1c1c1c'>Semester plan</text><text x='112' y='312' text-anchor='middle' font-size='11.5' fill='#5e5e5e'>builds on mocks first</text></g><g><rect x='248' y='72' width='272' height='124' rx='8' fill='#2f6fd6' fill-opacity='0.08' stroke='#2f6fd6' stroke-width='2'/><rect x='256' y='80' width='256' height='24' rx='6' fill='none' stroke='#a3a197' stroke-width='1.25'/><rect x='256' y='108' width='256' height='24' rx='6' fill='none' stroke='#a3a197' stroke-width='1.25'/><rect x='256' y='136' width='256' height='24' rx='6' fill='none' stroke='#a3a197' stroke-width='1.25'/><rect x='256' y='164' width='256' height='24' rx='6' fill='none' stroke='#a3a197' stroke-width='1.25'/><text x='268' y='96' font-weight='600' fill='#1c1c1c'>GET /programs</text><text x='500' y='96' text-anchor='end' font-size='11.5' fill='#5e5e5e'>majors, requirements</text><text x='268' y='124' font-weight='600' fill='#1c1c1c'>GET /courses</text><text x='500' y='124' text-anchor='end' font-size='11.5' fill='#5e5e5e'>prereqs, terms</text><text x='268' y='152' font-weight='600' fill='#1c1c1c'>GET /sources</text><text x='500' y='152' text-anchor='end' font-size='11.5' fill='#5e5e5e'>citations</text><text x='268' y='180' font-weight='600' fill='#1c1c1c'>GET /demo-profile</text><text x='500' y='180' text-anchor='end' font-size='11.5' fill='#5e5e5e'>fictional student</text></g><g><rect x='248' y='212' width='272' height='124' rx='8' fill='#2f6fd6' fill-opacity='0.08' stroke='#2f6fd6' stroke-width='2'/><rect x='256' y='220' width='256' height='24' rx='6' fill='none' stroke='#a3a197' stroke-width='1.25'/><rect x='256' y='248' width='256' height='24' rx='6' fill='none' stroke='#a3a197' stroke-width='1.25'/><rect x='256' y='276' width='256' height='24' rx='6' fill='none' stroke='#a3a197' stroke-width='1.25'/><rect x='256' y='304' width='256' height='24' rx='6' fill='none' stroke='#a3a197' stroke-width='1.25'/><text x='268' y='236' font-weight='600' fill='#1c1c1c'>POST /eligibility</text><text x='500' y='236' text-anchor='end' font-size='11.5' fill='#5e5e5e'>status per course</text><text x='268' y='264' font-weight='600' fill='#1c1c1c'>POST /audit</text><text x='500' y='264' text-anchor='end' font-size='11.5' fill='#5e5e5e'>credits, progress</text><text x='268' y='292' font-weight='600' fill='#1c1c1c'>POST /plan</text><text x='500' y='292' text-anchor='end' font-size='11.5' fill='#5e5e5e'>terms, unscheduled</text><text x='268' y='320' font-weight='600' fill='#1c1c1c'>POST /recalculate</text><text x='500' y='320' text-anchor='end' font-size='11.5' fill='#5e5e5e'>all three, diff</text></g><g><rect x='568' y='72' width='168' height='124' rx='8' fill='none' stroke='#a3a197' stroke-width='1.25'/><text x='652' y='100' text-anchor='middle' font-weight='600' fill='#1c1c1c'>Data + rules</text><text x='652' y='120' text-anchor='middle' font-size='11.5' fill='#5e5e5e'>cited JSON files:</text><text x='652' y='136' text-anchor='middle' font-size='11.5' fill='#5e5e5e'>programs, courses,</text><text x='652' y='152' text-anchor='middle' font-size='11.5' fill='#5e5e5e'>sources, demo student</text></g><g><rect x='568' y='212' width='168' height='124' rx='8' fill='none' stroke='#a3a197' stroke-width='1.25'/><text x='652' y='240' text-anchor='middle' font-weight='600' fill='#1c1c1c'>Back end</text><text x='652' y='260' text-anchor='middle' font-size='11.5' fill='#5e5e5e'>pure engine + tests</text><text x='652' y='276' text-anchor='middle' font-size='11.5' fill='#5e5e5e'>eligibility, audit,</text><text x='652' y='292' text-anchor='middle' font-size='11.5' fill='#5e5e5e'>planner, recalculate</text></g></svg>
