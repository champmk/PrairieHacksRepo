o student</text></g><g><rect x='168' y='394' width='352' height='56' rx='8' fill='none' stroke='#a3a197' stroke-width='1.25'/><text x='344' y='418' text-anchor='middle' font-weight='600' fill='#1c1c1c'>Official Grinnell sources</text><text x='344' y='434' text-anchor='middle' font-size='11.5' fill='#5e5e5e'>catalog, Registrar, advising guides, course search</text></g><g><rect x='536' y='394' width='176' height='56' rx='8' fill='none' stroke='#a3a197' stroke-width='1.25' stroke-dasharray='4 4'/><text x='624' y='418' text-anchor='middle' font-weight='600' fill='#1c1c1c'>COLSS connector</text><text x='624' y='434' text-anchor='middle' font-size='11.5' fill='#5e5e5e'>future, read-only</text></g><line x1='24' y1='474' x2='736' y2='474' stroke='#d6d4cc' stroke-width='1'/><text x='24' y='502' font-size='15' font-weight='600' fill='#1c1c1c'>Demo: one waiver unlocks CSC 207 without adding a credit</text><g fill='none' stroke='#a3a197' stroke-width='1.25'><path d='M148 558H172' marker-end='url(#arch-arrow)'/><path d='M296 558H320' marker-end='url(#arch-arrow)'/></g><g><rect x='24' y='522' width='124' height='72' rx='8' fill='#2f6fd6' fill-opacity='0.12' stroke='#2f6fd6' stroke-width='2'/><text x='86' y='546' text-anchor='middle' font-weight='600' fill='#1c1c1c'>One edit</text><text x='86' y='562' text-anchor='middle' font-size='11.5' fill='#1c1c1c'>toggle a CSC</text><text x='86' y='578' text-anchor='middle' font-size='11.5' fill='#1c1c1c'>waiver</text></g><g><rect x='172' y='522' width='124' height='72' rx='8' fill='none' stroke='#a3a197' stroke-width='1.25'/><text x='234' y='546' text-anchor='middle' font-weight='600' fill='#1c1c1c'>Engine reruns</text><text x='234' y='562' text-anchor='middle' font-size='11.5' fill='#5e5e5e'>eligibility,</text><text x='234' y='578' text-anchor='middle' font-size='11.5' fill='#5e5e5e'>audit, planner</text></g><g><rect x='320' y='514' width='416' height='88' rx='8' fill='none' stroke='#d6d4cc' stroke-width='1'/><rect x='328' y='522' width='1